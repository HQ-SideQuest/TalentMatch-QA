name: TalentMatch CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talentmatch-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  TESTED_COMMIT: ${{ github.sha }}

jobs:
  backend:
    name: Backend tests and coverage
    if: github.repository == 'HQ-SideQuest/TalentMatch-QA'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - name: Record tested commit
        run: |
          mkdir -p server/reports
          git rev-parse HEAD > server/reports/tested-commit.txt
          node --version > server/reports/node-version.txt
      - name: Run all controller and utility tests
        working-directory: server
        run: |
          mkdir -p coverage reports
          node --test --experimental-test-coverage \
            --test-reporter=spec --test-reporter=junit --test-reporter=lcov \
            --test-reporter-destination=stdout \
            --test-reporter-destination=reports/unit-results.xml \
            --test-reporter-destination=coverage/lcov.info \
            "controllers/*.test.js" "utils/*.test.js"
      - name: Save unit results and coverage even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-${{ github.sha }}
          path: |
            server/reports/
            server/coverage/
          if-no-files-found: warn
          retention-days: 14

  bdd:
    name: CV scoring BDD scenarios
    if: github.repository == 'HQ-SideQuest/TalentMatch-QA'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - name: Run feature files and preserve BDD reports
        working-directory: server
        run: |
          mkdir -p reports
          npx --no-install cucumber-js --format progress \
            --format json:reports/bdd-results.json \
            --format junit:reports/bdd-results.xml \
            --format html:reports/bdd-report.html
      - name: Save BDD evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bdd-${{ github.sha }}
          path: server/reports/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend tests coverage and build
    if: github.repository == 'HQ-SideQuest/TalentMatch-QA'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - name: Run all frontend tests and collect coverage
        run: npm test --prefix client -- --watchAll=false --runInBand --coverage
      - name: Build production frontend
        run: npm run build --prefix client
      - name: Save frontend coverage even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-coverage-${{ github.sha }}
          path: client/coverage/
          if-no-files-found: warn
          retention-days: 14

  api:
    name: Postman API integration tests
    if: github.repository == 'HQ-SideQuest/TalentMatch-QA'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            QA/Harshan/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix server
      - name: Install API test runner
        run: npm ci --prefix QA/Harshan
      - name: Run Postman collection against disposable test API
        run: npm test --prefix QA/Harshan
      - name: Save sanitized API evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: postman-api-${{ github.sha }}
          path: QA/Harshan/results/
          if-no-files-found: warn
          retention-days: 14
