# SonarQube configuration for TalentMatch.
# The token is passed on the command line (-Dsonar.token=...), never stored here.
sonar.projectKey=TalentMatch
sonar.projectName=TalentMatch
sonar.sourceEncoding=UTF-8

# Application code (server + React client) and test code
sonar.sources=server,client/src
sonar.tests=server,client/src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,server/features/**
sonar.exclusions=**/node_modules/**,**/coverage/**,**/build/**,**/*.test.js,**/*.test.jsx,server/features/**

# Files that are not product logic: kept out of coverage only
sonar.coverage.exclusions=server/scripts/**,client/src/index.js,client/src/reportWebVitals.js,client/src/setupTests.js

# Coverage reports produced before the scan
#   server: node --test --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=coverage/lcov.info ...
#   client: npx react-scripts test --coverage --watchAll=false
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,client/coverage/lcov.info
